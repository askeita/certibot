# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MONGODB_URL): '%env(MONGODB_URL)%'
    env(MONGODB_DB): '%env(MONGODB_DB)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── Plugin Registry: all DocSourceInterface implementations are auto-tagged ──
    _instanceof:
        App\Core\DocSource\DocSourceInterface:
            tags: ['app.doc_source']

    # ── MongoDB QueryBuilders ────────────────────────────────────────────────
    App\Repository\MongoDBQueryBuilder.exam_topics:
        class: App\Repository\MongoDBQueryBuilder
        arguments:
            $url: '%env(MONGODB_URL)%'
            $databaseName: '%env(MONGODB_DB)%'

    App\Repository\MongoDBQueryBuilder.topics_links:
        class: App\Repository\MongoDBQueryBuilder
        arguments:
            $url: '%env(MONGODB_URL)%'
            $databaseName: '%env(MONGODB_DB)%'

    App\Repository\MongoDBQueryBuilder.mcq_gpt-4o:
        class: App\Repository\MongoDBQueryBuilder
        arguments:
            $url: '%env(MONGODB_URL)%'
            $databaseName: '%env(MONGODB_DB)%'

    # PHP manual uses its own database
    App\Repository\MongoDBQueryBuilder.php_mcq_gpt-4o:
        class: App\Repository\MongoDBQueryBuilder
        arguments:
            $url: '%env(MONGODB_URL)%'
            $databaseName: 'php_manual'

    # ── Browser client ───────────────────────────────────────────────────────
    App\Service\BrowserClientService:
        arguments:
            $browser: '%env(BROWSER)%'
            $chromeDriverPath: '%env(CHROME_DRIVER_PATH)%'
            $geckoDriverPath: '%env(GECKO_DRIVER_PATH)%'
            $edgeDriverPath: '%env(EDGE_DRIVER_PATH)%'

    # ── OpenAI Adapter (hexagonal output port) ───────────────────────────────
    App\Infrastructure\OpenAI\OpenAiMcqGenerator:
        arguments:
            $openAIConfig: '%openai%'

    App\Core\Mcq\Port\McqGeneratorInterface:
        alias: App\Infrastructure\OpenAI\OpenAiMcqGenerator

    App\Service\DriverUpdaterService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ── Commands ─────────────────────────────────────────────────────────────
    App\Command\CrawlSymfonyExamTopicsCommand:
        arguments:
            $mongoDbUrl: '%env(MONGODB_URL)%'

    App\Command\CrawlSymfonyDocCommand:
        arguments:
            $mongoDbUrl: '%env(MONGODB_URL)%'

    App\Command\ReformulateTextToMcqCommand:
        arguments:
            $mongoDbUrl: '%env(MONGODB_URL)%'
        tags:
            - { name: 'console.command', command: 'app:reformulate-text-to-mcq' }

    App\Security\UserChecker: ~