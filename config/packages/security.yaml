security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Document\User:
            algorithm: auto

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_index
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
      - { path: ^/login, roles: PUBLIC_ACCESS }
      - { path: ^/register, roles: PUBLIC_ACCESS }
      - { path: ^/verify, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/check-exam-topics, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/check-topics-links, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/check-mcq-collection, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/execute-crawl-topics-command, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/execute-crawl-doc-command, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/execute-mcq-command, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/exam-topics, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/quiz, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/fetch-doc, roles: PUBLIC_ACCESS }
      - { path: ^/symfony/\d+/results, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
