nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: []
        allow_headers: []
        allow_methods: []
        allow_private_network: false
        expose_headers: []
        max_age: 0
        hosts: []
        origin_regex: false
        forced_allow_origin_value: ~
        skip_same_as_origin: true
    paths:
        '^/api/':
            allow_origin: ['*']
            allow_headers: ['X-Custom-Auth', 'X-Symfony-Profiler-Disable', 'X-API-KEY', 'Content-Type', 'Accept', 'Authorization']
            allow_methods: ['POST', 'PUT', 'GET', 'DELETE', 'OPTIONS']
            max_age: 3600
        '^/symfony/':
            origin_regex: true
            allow_origin: ['^https://127\.0\.0\.1:[0-9]+$', '^http://127\.0\.0\.1:[0-9]+$', '^https://localhost:[0-9]+$', '^http://localhost:[0-9]+$']
            allow_headers: ['Content-Type', 'Accept', 'Authorization', 'X-Requested-With']
            allow_methods: ['POST', 'PUT', 'GET', 'DELETE', 'OPTIONS']
            allow_credentials: true
            max_age: 3600
        '^/':
            origin_regex: true
            allow_origin: ['^https://127\.0\.0\.1:[0-9]+$', '^http://127\.0\.0\.1:[0-9]+$', '^https://localhost:[0-9]+$', '^http://localhost:[0-9]+$']
            allow_headers: ['Content-Type', 'Accept', 'Authorization', 'X-Requested-With']
            allow_methods: ['POST', 'PUT', 'GET', 'DELETE', 'OPTIONS']
            allow_credentials: true
            max_age: 3600
